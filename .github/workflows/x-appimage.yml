name: X - AppImage build

on:
  workflow_call:
    inputs:
      refresh_cache:
        type: boolean
        default: false

env:
  APPIMAGE_EXTRACT_AND_RUN: '1'
  DEBIAN_FRONTEND: noninteractive
  ROOJS_APT_SUITE: plucky

jobs:
  appimage:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:25.04
    steps:
      - name: Install checkout tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl gnupg sudo

      - uses: actions/checkout@v4
        with:
          path: argusrm

      - uses: actions/cache@v4
        with:
          path: |
            argusrm/.sqgipkg
            argusrm/build-linux-x86_64
          key: argusrm-appimage-v1-${{ inputs.refresh_cache && github.run_id || 'stable' }}-${{ hashFiles('argusrm/sqgipkg.json', 'argusrm/**/*.vala', 'argusrm/**/meson.build') }}

      - name: Enable RooJS packages
        working-directory: argusrm
        run: |
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://roojs.github.io/repos/key.gpg |
            gpg --batch --yes --dearmor -o /etc/apt/keyrings/roojs.gpg
          curl -fsSL https://roojs.github.io/repos/sources |
            sed "s/@suite@/${ROOJS_APT_SUITE}/" \
            > /etc/apt/sources.list.d/roojs.sources
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config file wget \
            meson valac squashfs-tools \
            libglib2.0-dev libgee-0.8-dev libjson-glib-dev libsoup-3.0-dev \
            libgnutls28-dev libsqlite3-dev libgtk-4-dev libadwaita-1-dev \
            libavahi-gobject-dev libocrpc-dev libocsqlite-dev

      - name: Read sqgi revision
        id: sqgi
        working-directory: argusrm
        run: |
          rev="$(grep -v '^[[:space:]]*#' scripts/release/sqgi.revision |
            grep -v '^[[:space:]]*$' | tr -d '[:space:]')"
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: supercamel/sqgi
          path: sqgi
          ref: ${{ steps.sqgi.outputs.rev }}

      - name: Build sqgi
        run: |
          cmake -S sqgi -B sqgi/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSQ_ENABLE_JIT=ON
          cmake --build sqgi/build
          cmake --install sqgi/build --prefix /usr/local
          ldconfig

      - name: Build AppImage
        working-directory: argusrm
        run: |
          chmod +x scripts/release/changelog.sh \
            scripts/release/meson-sqgipkg-setup.sh
          sqgipkg --target appimage --appimage-arch x86_64 \
            --sqgi-source-dir "$GITHUB_WORKSPACE/sqgi"
          mkdir -p artifacts
          version="$(scripts/release/changelog.sh packaging-version)"
          cp dist-linux-x86_64/ArgusController.AppImage \
            "artifacts/ArgusController-${version}-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: argusrm-appimage
          path: argusrm/artifacts/*.AppImage
