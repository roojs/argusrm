name: X - Windows installer build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      OLLMCHAT_RELEASE: v1.4.12
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep Vala sources as LF
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          path: argusrm

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: strict
          update: true
          install: >-
            base-devel
            unzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-vala
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-libgee
            mingw-w64-ucrt-x86_64-libsoup3
            mingw-w64-ucrt-x86_64-gnutls
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-nsis

      # The OLLMchat release publishes the MSYS packages. Install those
      # with pacman. Compile Argus only. Never configure or compile
      # OLLMchat, libocrpc, or libocsqlite from source.
      - name: Install OLLMchat Windows libraries
        run: |
          set -euo pipefail
          version="${OLLMCHAT_RELEASE#v}"
          base="https://github.com/roojs/OLLMchat/releases/download/${OLLMCHAT_RELEASE}"
          mkdir -p ollm-libs
          for name in libocrpc libocsqlite; do
            curl -fsSL -o "ollm-libs/${name}.pkg.tar.zst" \
              "${base}/mingw-w64-ucrt-x86_64-${name}-${version}-1-any.pkg.tar.zst"
          done
          pacman -U --noconfirm ollm-libs/*.pkg.tar.zst

      - name: Build Argus RM
        working-directory: argusrm
        run: |
          meson setup build-windows \
            --prefix=/ucrt64 --buildtype=release -Ddocs=false
          meson compile -C build-windows ./agent/argus-agent:executable

      - name: Build NSIS installer
        working-directory: argusrm
        run: |
          chmod +x scripts/release/changelog.sh \
            scripts/ci/copy-windows-runtime.sh \
            scripts/ci/windows-package-nsis.sh
          scripts/ci/windows-package-nsis.sh
          mkdir -p artifacts
          cp -v dist-windows/ArgusAgent-*-Setup.exe artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: argusrm-windows
          path: argusrm/artifacts/*.exe
