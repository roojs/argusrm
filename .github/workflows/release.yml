name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-packages'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify release metadata
        run: |
          set -euo pipefail
          chmod +x scripts/release/changelog.sh
          changelog_version="$(scripts/release/changelog.sh version)"
          project_version="$(awk -F"'" '/^[[:space:]]*version:/ { print $2; exit }' meson.build)"
          [[ "${changelog_version}" == "${project_version}" ]]
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            [[ "${GITHUB_REF_NAME}" == "v${changelog_version}" ]]
          fi
          test -n "$(scripts/release/changelog.sh notes)"

  debian:
    needs: verify
    uses: ./.github/workflows/x-debian.yml
    permissions:
      contents: read

  build-rpm-fedora:
    name: Fedora
    needs: verify
    uses: ./.github/workflows/x-rpm.yml
    with:
      job_name: Fedora 44 RPMs
      distro: fedora
      image: fedora:44
      artifact_name: argusrm-rpm-fedora
    permissions:
      contents: read

  appimage:
    needs: verify
    uses: ./.github/workflows/x-appimage.yml
    permissions:
      contents: read

  windows:
    needs: verify
    uses: ./.github/workflows/x-windows.yml
    permissions:
      contents: read

  android:
    needs: verify
    uses: ./.github/workflows/x-android.yml
    with:
      non_blocking: false
    permissions:
      contents: read

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [debian, build-rpm-fedora, appimage, windows, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p artifacts/main artifacts/packages
          for file in artifacts/*; do
            [[ -f "${file}" ]] || continue
            case "${file}" in
              *.deb|*.rpm) mv "${file}" artifacts/packages/ ;;
              *.AppImage|*.exe|*.apk) mv "${file}" artifacts/main/ ;;
              *) echo "Unknown release artifact: ${file}" >&2; exit 1 ;;
            esac
          done
          package_files=(artifacts/packages/*)
          main_files=(artifacts/main/*)
          apk_files=(artifacts/main/*.apk)
          appimage_files=(artifacts/main/*.AppImage)
          windows_files=(artifacts/main/*.exe)
          ((${#package_files[@]})) || {
            echo "No Debian or RPM artifacts were downloaded" >&2
            exit 1
          }
          ((${#appimage_files[@]})) || {
            echo "No AppImage was downloaded" >&2
            exit 1
          }
          ((${#windows_files[@]})) || {
            echo "No Windows installer was downloaded" >&2
            exit 1
          }
          ((${#apk_files[@]})) || {
            echo "No Android APK was downloaded" >&2
            exit 1
          }
          chmod +x scripts/release/changelog.sh \
            scripts/release/render-release-notes.sh
          scripts/release/render-release-notes.sh \
            "${GITHUB_REF_NAME}" release-notes.md
          package_tag="${GITHUB_REF_NAME}-packages"
          {
            echo "Debian and Fedora package files for ${GITHUB_REF_NAME}."
            echo
            echo "AppImage, Windows, and Android builds are on ${GITHUB_REF_NAME}."
          } > package-notes.md
          gh release create "${package_tag}" "${package_files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${GITHUB_REF_NAME} packages" \
            --notes-file package-notes.md \
            --latest=false \
          || gh release upload "${package_tag}" "${package_files[@]}" \
            --repo "${GITHUB_REPOSITORY}" --clobber
          gh release create "${GITHUB_REF_NAME}" "${main_files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
          || gh release upload "${GITHUB_REF_NAME}" "${main_files[@]}" \
            --repo "${GITHUB_REPOSITORY}" --clobber
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" --latest
