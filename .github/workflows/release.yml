name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-packages'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify release metadata
        run: |
          set -euo pipefail
          chmod +x scripts/release/changelog.sh
          changelog_version="$(scripts/release/changelog.sh version)"
          project_version="$(awk -F"'" '/^[[:space:]]*version:/ { print $2; exit }' meson.build)"
          [[ "${changelog_version}" == "${project_version}" ]]
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            [[ "${GITHUB_REF_NAME}" == "v${changelog_version}" ]]
          fi
          test -n "$(scripts/release/changelog.sh notes)"

  debian:
    needs: verify
    uses: ./.github/workflows/x-debian.yml
    permissions:
      contents: read

  build-rpm-fedora:
    name: Fedora
    needs: verify
    uses: ./.github/workflows/x-rpm.yml
    with:
      job_name: Fedora 44 RPMs
      distro: fedora
      image: fedora:44
      artifact_name: argusrm-rpm-fedora
    permissions:
      contents: read

  windows:
    needs: verify
    uses: ./.github/workflows/x-windows.yml
    permissions:
      contents: read

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [debian, build-rpm-fedora, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          release_files=()
          for file in artifacts/*; do
            [[ -f "${file}" ]] || continue
            case "${file}" in
              *.deb|*.rpm|*.exe) release_files+=("${file}") ;;
              *) echo "Unknown release artifact: ${file}" >&2; exit 1 ;;
            esac
          done
          package_files=(artifacts/*.deb artifacts/*.rpm)
          windows_files=(artifacts/*.exe)
          ((${#package_files[@]})) || {
            echo "No Debian or RPM artifacts were downloaded" >&2
            exit 1
          }
          ((${#windows_files[@]})) || {
            echo "No Windows installer was downloaded" >&2
            exit 1
          }
          chmod +x scripts/release/changelog.sh \
            scripts/release/render-release-notes.sh
          scripts/release/render-release-notes.sh \
            "${GITHUB_REF_NAME}" release-notes.md
          gh release create "${GITHUB_REF_NAME}" "${release_files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
          || gh release upload "${GITHUB_REF_NAME}" "${release_files[@]}" \
            --repo "${GITHUB_REPOSITORY}" --clobber
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" --latest
