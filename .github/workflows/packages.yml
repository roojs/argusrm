name: Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debian:
    uses: ./.github/workflows/x-debian.yml
    permissions:
      contents: read

  rpm:
    uses: ./.github/workflows/x-rpm.yml
    permissions:
      contents: read

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [debian, rpm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish package release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(artifacts/*.deb artifacts/*.rpm)
          ((${#files[@]})) || {
            echo "No package artifacts were downloaded" >&2
            exit 1
          }
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
